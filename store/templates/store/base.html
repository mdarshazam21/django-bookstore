{% load static %}
{% load cart_tags %}
<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Online Bookstore{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>

<body>
    <div class="site-header">
        <a class="logo" href="{% url 'book_list' %}">📚 Online Bookstore</a>
        <div>
            {% if user.is_authenticated %}
            <span style="color:white; margin-right:10px;">Hi, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="cart-link" style="border:none; cursor:pointer;">Logout</button>
            </form>
            {% else %}
            <a class="cart-link" href="{% url 'login' %}">Login</a>
            {% endif %}
            <a class="cart-link" href="{% url 'cart_detail' %}">🛒 Cart ({% cart_item_count %})</a>
        </div>
    </div>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>

</html>
